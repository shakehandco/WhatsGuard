appId: app.whatsguard.desktop
productName: WhatsGuard
directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

# Ship the native sidecar + OTA config into Contents/Resources/{bin,config}.
# These land OUTSIDE the asar, and being inside the .app they are deep-signed by
# @electron/osx-sign with the entitlements below.
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/config
    to: config
    filter: ['**/*']

mac:
  category: public.app-category.utilities
  # arm64-only for MVP: the bundled llama-server is Apple-Silicon. Building x64
  # too would ship a broken binary AND make parallel dmg builds fight over the
  # /Volumes/WhatsGuard mount (hdiutil detach race). Add x64 when we bundle an
  # Intel llama-server.
  #
  # BOTH targets are required: the dmg is the first-install download; the zip is
  # what electron-updater (Squirrel.Mac) actually consumes for in-app updates —
  # a dmg-only build cannot auto-update.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Developer ID signing + hardened runtime → silent Gatekeeper once notarized.
  hardenedRuntime: true
  gatekeeperAssess: false
  # The SAME entitlements are applied to the app and inherited by the nested
  # llama-server binary, so the Metal backend isn't killed by taskgated.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization is OFF by default so local credential-less builds succeed.
  # For DISTRIBUTION, set WG_NOTARIZE=1 with APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  # + APPLE_TEAM_ID (or APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER) in the
  # environment — the pack:mac:release script enables it (see package.json).
  notarize: false
  extendInfo:
    NSUserNotificationsUsageDescription: WhatsGuard notifies you when it detects a likely scam.
    # Declare the UI languages so macOS recognises them (otherwise app.getLocale()
    # falls back to English in a packaged build). Detection also uses the OS's
    # preferred-language list in code, but this keeps the bundle honest.
    CFBundleAllowMixedLocalizations: true
    CFBundleLocalizations:
      - en
      - zh-Hans
      - zh-Hant
      - id
      - de
      - es

dmg:
  title: WhatsGuard
  # iconSize/contents can be themed later.

win:
  # x64-only: the bundled llama-server.exe (llama.cpp CPU build + its DLLs in
  # resources/bin) is 64-bit. Electron 39 itself requires Windows 10+.
  #
  # nsis is required (not just convenient): it's the target electron-updater's
  # NsisUpdater consumes, and building it emits latest.yml + the .blockmap that
  # in-app updates verify against (the Windows analogue of latest-mac.yml).
  target:
    - target: nsis
      arch: [x64]
  # Unsigned for now — signing needs an Authenticode cert (see docs/RELEASE.md
  # for the macOS pipeline this should mirror). Once signing lands, also set
  # publisherName so electron-updater verifies the certificate on updates:
  # NSIS has no Squirrel.Mac-style OS signature gate of its own.

nsis:
  # One-click per-user install: no admin prompt, no wizard — right default for
  # the elder-focused audience. Per-user also lets in-app updates install
  # without elevation.
  oneClick: true
  perMachine: false
  # Keep session/model data across uninstall-reinstall cycles; users can clear
  # userData manually. Deleting it here would silently drop WhatsApp pairing.
  deleteAppDataOnUninstall: false

# Model updates ship on their own channel — never re-download the model for an
# app patch (see Phase 6). The model is NOT packaged into the installer.
#
# Publish target for electron-updater. This block is also what makes
# electron-builder embed `app-update.yml` into the bundle, so the shipped app
# knows where to look for updates. The release workflow builds with
# `--publish never`, verifies the signed artifacts, then uploads the exact
# bytes (dmg + zip + latest-mac.yml + blockmaps) to the GitHub release.
publish:
  provider: github
  owner: shakehandco
  repo: WhatsGuard
